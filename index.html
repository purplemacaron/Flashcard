<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Master 플래시카드 481-600</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #f3f1fa; color: #333;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  h1 { font-size: 1.2rem; color: #6b5ca5; margin-bottom: 12px; }
  .top { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
  .top button {
    border: 1px solid #6b5ca5; background: #fff; color: #6b5ca5;
    padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.9rem;
  }
  .top button.on { background: #6b5ca5; color: #fff; }
  .progress { font-size: 0.9rem; color: #777; margin-bottom: 6px; }
  .bar { width: 100%; max-width: 480px; height: 6px; background: #ddd; border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
  .bar div { height: 100%; background: #6b5ca5; width: 0; transition: width .3s; }
  .scene { width: 100%; max-width: 480px; height: 300px; perspective: 1000px; cursor: pointer; }
  .card {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d; transition: transform .5s;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 16px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px; text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,.1);
  }
  .front { background: #fff; }
  .back { background: #6b5ca5; color: #fff; transform: rotateY(180deg); }
  .num { position: absolute; top: 14px; left: 18px; font-size: .8rem; opacity: .6; }
  .word { font-size: 2.2rem; font-weight: bold; }
  .meaning { font-size: 1.25rem; line-height: 1.7; word-break: keep-all; }
  .hint { position: absolute; bottom: 14px; font-size: .75rem; opacity: .5; }
  .nav { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
  .nav button {
    border: none; padding: 12px 18px; border-radius: 12px;
    font-size: 1rem; cursor: pointer; color: #fff;
  }
  .prev, .next { background: #9a8fc7; }
  .know { background: #4caf7a; }
  .dont { background: #e57373; }
  .done { display: none; text-align: center; margin-top: 30px; }
  .done h2 { color: #6b5ca5; margin-bottom: 10px; }
  .done button { margin-top: 14px; padding: 10px 20px; border: none; border-radius: 12px; background: #6b5ca5; color: #fff; font-size: 1rem; cursor: pointer; }
  .keys { margin-top: 16px; font-size: .75rem; color: #999; text-align: center; }
</style>
</head>
<body>

<h1>Word Master 중등 고난도 · 481~600</h1>

<div class="top">
  <button id="modeBtn">영어 → 뜻</button>
  <button id="shuffleBtn">섞기</button>
  <button id="unknownBtn">모르는 것만</button>
  <button id="resetBtn">처음부터</button>
</div>

<div class="progress" id="progress"></div>
<div class="bar"><div id="barFill"></div></div>

<div id="study" style="width:100%;display:flex;flex-direction:column;align-items:center;">
  <div class="scene" id="scene">
    <div class="card" id="card">
      <div class="face front">
        <span class="num" id="numF"></span>
        <div id="frontText"></div>
        <span class="hint">탭해서 뒤집기</span>
      </div>
      <div class="face back">
        <span class="num" id="numB"></span>
        <div id="backText"></div>
      </div>
    </div>
  </div>

  <div class="nav">
    <button class="prev" id="prevBtn">◀ 이전</button>
    <button class="dont" id="dontBtn">몰라요</button>
    <button class="know" id="knowBtn">알아요</button>
    <button class="next" id="nextBtn">다음 ▶</button>
  </div>
  <div class="keys">키보드: 스페이스 = 뒤집기 · ←/→ = 이전/다음 · ↑ = 알아요 · ↓ = 몰라요</div>
</div>

<div class="done" id="done">
  <h2>한 바퀴 끝!</h2>
  <p id="result"></p>
  <button id="retryUnknown">모르는 단어만 다시</button>
  <button id="retryAll">전체 다시</button>
</div>

[583,"dispute","ⓝ 논쟁 ⓥ 논쟁하다"],
[584,"postpone","연기하다, 뒤로 미루다"],
[585,"convince","1. (설득하여) 납득시키다 2. 확신시키다"],
[586,"persuade","설득하다"],
[587,"assume","추측하다, 사실이라고 생각하다"],
[588,"approve","찬성하다, 승인하다"],
[589,"session","1. (국회의) 회기, 기간 2. (대학) 학기, 수업"],
[590,"deed","1. 업적 2. 행위"],
[591,"reputation","1. 평판 2. 명성, 덕망"],
[592,"conservative","보수적인"],
[593,"command","ⓥ 1. (군대 등을) 지휘하다 2. 명령하다 ⓝ 1. 지휘권 2. 명령 3. (언어) 구사 능력"],
[594,"hostile","적대적인"],
[595,"authority","1. 권위, 권한 2. (복수형) 당국"],
[596,"cabinet","1. (정치) 내각 2. 장식장, 캐비닛"],
[597,"federal","연방의, 연방제의"],
[598,"unify","통일하다, 단일화하다"],
[599,"run for","~에 입후보하다, 출마하다"],
[600,"speak for","~을 대변하다"]
];

let deck = [...DATA];
let idx = 0;
let reverse = false;          // false: 영어→뜻, true: 뜻→영어
let unknown = new Set();      // 몰라요 누른 단어 번호
let known = new Set();

const $ = id => document.getElementById(id);
const card = $("card");

function render() {
  const [n, w, m] = deck[idx];
  const wordHTML = `<div class="word">${w}</div>`;
  const meanHTML = `<div class="meaning">${m}</div>`;
  card.classList.remove("flipped");
  setTimeout(() => {
    $("frontText").innerHTML = reverse ? meanHTML : wordHTML;
    $("backText").innerHTML  = reverse ? wordHTML : meanHTML;
  }, 150);
  $("numF").textContent = $("numB").textContent = n;
  $("progress").textContent =
    `${idx + 1} / ${deck.length}  ·  알아요 ${known.size}  ·  몰라요 ${unknown.size}`;
  $("barFill").style.width = ((idx + 1) / deck.length * 100) + "%";
}

function flip() { card.classList.toggle("flipped"); }

function next() {
  if (idx < deck.length - 1) { idx++; render(); }
  else finish();
}
function prev() { if (idx > 0) { idx--; render(); } }

function mark(isKnown) {
  const n = deck[idx][0];
  if (isKnown) { known.add(n); unknown.delete(n); }
  else { unknown.add(n); known.delete(n); }
  next();
}

function finish() {
  $("study").style.display = "none";
  $("done").style.display = "block";
  $("result").textContent = `알아요 ${known.size}개 · 몰라요 ${unknown.size}개`;
}

function start(list) {
  if (!list.length) { alert("해당하는 단어가 없어요!"); return; }
  deck = list; idx = 0;
  $("done").style.display = "none";
  $("study").style.display = "flex";
  render();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

$("scene").onclick = flip;
$("nextBtn").onclick = next;
$("prevBtn").onclick = prev;
$("knowBtn").onclick = () => mark(true);
$("dontBtn").onclick = () => mark(false);

$("modeBtn").onclick = () => {
  reverse = !reverse;
  $("modeBtn").textContent = reverse ? "뜻 → 영어" : "영어 → 뜻";
  $("modeBtn").classList.toggle("on", reverse);
  render();
};
$("shuffleBtn").onclick = () => start(shuffle(deck));
$("unknownBtn").onclick = () => start(DATA.filter(d => unknown.has(d[0])));
$("resetBtn").onclick = () => { known.clear(); unknown.clear(); start([...DATA]); };
$("retryUnknown").onclick = () => start(shuffle(DATA.filter(d => unknown.has(d[0]))));
$("retryAll").onclick = () => { known.clear(); unknown.clear(); start([...DATA]); };

document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); flip(); }
  else if (e.key === "ArrowRight") next();
  else if (e.key === "ArrowLeft") prev();
  else if (e.key === "ArrowUp") mark(true);
  else if (e.key === "ArrowDown") mark(false);
});

render();
</script>
</body>
</html>
